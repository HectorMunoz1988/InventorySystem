{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'inventory/styles.css' %}">

        
    <link
        rel="icon"
        type="image/png"
        href="{% static 'inventory/favicon.ico' %}"
    >

    <title>
        {% block title %}
            Inventory System
        {% endblock %}
    </title>

</head>


<body>

    <header class="site-header">

        <nav class="navbar">

            <div class="navbar-brand">

                <a href="{% url 'home' %}">
                    Sistema de Inventario
                </a>

            </div>


            <div class="navbar-links">

                <a href="{% url 'product_list' %}">
                    Productos
                </a>

                <a href="{% url 'supplier_list' %}">
                    Proveedores
                </a>

                <a href="{% url 'category_list' %}">
                    Categorías
                </a>

                <a href="{% url 'movement_charts' %}">
                    Gráficos
                </a>

            </div>

        </nav>

    </header>


    <main class="main-content">

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        {% block content %}
        {% endblock %}

    </main>


    <footer class="site-footer">

    </footer>

</body>

</html>
