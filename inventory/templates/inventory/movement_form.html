{% extends 'inventory/base.html' %}


{% block title %}
    Movimiento de stock - Inventory System
{% endblock %}


{% block content %}

<section class="form-page">

    <div class="form-card">

        <header class="page-header">

            <h1>
                Registrar movimiento
            </h1>

            <p>
                {{ product.name }}
            </p>

        </header>


        <form method="post" class="inventory-form">

            {% csrf_token %}

            {{ form.as_p }}


            <div class="form-actions">

                <button type="submit">
                    Registrar movimiento
                </button>

                <a
                    href="{% url 'product_detail' product.id %}"
                    class="button"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
